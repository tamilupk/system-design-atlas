server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Serve prerendered pages first; fall back to React Router for other routes.
    location / {
        try_files $uri/index.html $uri $uri/ /index.html;
    }

    # Missing scripts/styles must return 404, not the app's HTML shell.
    location /assets/ {
        try_files $uri =404;
    }
}
