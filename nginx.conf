server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;

    # HTML and unversioned files may be stored, but must be revalidated.
    add_header Cache-Control "no-cache" always;

    # Every published route is prerendered. Unknown paths retain an HTTP 404.
    location / {
        try_files $uri/index.html $uri $uri/ =404;
        error_page 404 /404.html;
    }

    location = /404.html {
        internal;
    }

    # Vite fingerprints everything in /assets/; changed content gets a new URL.
    # Do not use "always": missing assets must not receive a year-long cache TTL.
    # Missing scripts/styles must return 404, not the app's HTML shell.
    location /assets/ {
        # Location-level add_header replaces inherited headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
